    <meta charset="UTF-8">

    <meta name="robots" content="all">
    <title th:text="#{property.title}"></title>
    <link th:href="@{/images/village-life-logo-icon.png}" rel="icon" type="image/png"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/0.8.2/css/flag-icon.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="/css/min/list-properties.min.css">
    <link rel="stylesheet" href="/css/min/menu-style-about-us.min.css">
    <link rel="stylesheet" href="/css/min/auth.min.css">
</head>
<body>
<div th:replace="fragments :: property-menu"></div>
<div th:replace="fragments :: property-hamburger-menu"></div>
<div class="container">

    <!-- Button to Open Modal for Advanced Search -->
    <div class="text-end my-3">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#advancedSearchModal">
            Advanced Search
        </button>
    </div>

    <!-- Advanced Search Modal -->
    <div class="modal fade" id="advancedSearchModal" tabindex="-1" aria-labelledby="advancedSearchModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form th:action="@{/filter/search-property/0}" method="get">
                    <div class="modal-header">
                        <h5 class="modal-title" id="advancedSearchModalLabel">Advanced Property Search</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <!-- Property Type -->
                        <div class="mb-3">
                            <label for="propertyTypes" class="form-label">Property Types</label>
                            <select name="propertyTypes" id="propertyTypes" multiple class="form-select">
                                <option value="house">House</option>
                                <option value="apartment">Apartment</option>
                                <!-- Add more options as needed -->
                            </select>
                        </div>

                        <!-- Property Transfer Type -->
                        <div class="mb-3">
                            <label for="propertyTransferType" class="form-label">Transfer Type</label>
                            <input type="text" name="propertyTransferType" class="form-control" id="propertyTransferType">
                        </div>

                        <!-- Built-up Area Range -->
                        <div class="row mb-3">
                            <div class="col">
                                <label for="minBuiltUpArea" class="form-label">Min Built-up Area</label>
                                <input type="number" name="minBuiltUpArea" class="form-control" id="minBuiltUpArea">
                            </div>
                            <div class="col">
                                <label for="maxBuiltUpArea" class="form-label">Max Built-up Area</label>
                                <input type="number" name="maxBuiltUpArea" class="form-control" id="maxBuiltUpArea">
                            </div>
                        </div>

                        <!-- Yard Area Range -->
                        <div class="row mb-3">
                            <div class="col">
                                <label for="minYardArea" class="form-label">Min Yard Area</label>
                                <input type="number" name="minYardArea" class="form-control" id="minYardArea">
                            </div>
                            <div class="col">
                                <label for="maxYardArea" class="form-label">Max Yard Area</label>
                                <input type="number" name="maxYardArea" class="form-control" id="maxYardArea">
                            </div>
                        </div>

                        <!-- Rooms and Bathrooms Range -->
                        <div class="row mb-3">
                            <div class="col">
                                <label for="minRoomsCount" class="form-label">Min Rooms</label>
                                <input type="number" name="minRoomsCount" class="form-control" id="minRoomsCount">
                            </div>
                            <div class="col">
                                <label for="maxRoomsCount" class="form-label">Max Rooms</label>
                                <input type="number" name="maxRoomsCount" class="form-control" id="maxRoomsCount">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label for="minBathroomsCount" class="form-label">Min Bathrooms</label>
                                <input type="number" name="minBathroomsCount" class="form-control" id="minBathroomsCount">
                            </div>
                            <div class="col">
                                <label for="maxBathroomsCount" class="form-label">Max Bathrooms</label>
                                <input type="number" name="maxBathroomsCount" class="form-control" id="maxBathroomsCount">
                            </div>
                        </div>

                        <!-- Heating and Construction Types -->
                        <div class="mb-3">
                            <label for="heating" class="form-label">Heating Types</label>
                            <select name="heating" id="heating" multiple class="form-select">
                                <option value="central">Central</option>
                                <option value="individual">Individual</option>
                                <!-- Add more options as needed -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="constructionTypes" class="form-label">Construction Types</label>
                            <select name="constructionTypes" id="constructionTypes" multiple class="form-select">
                                <option value="brick">Brick</option>
                                <option value="concrete">Concrete</option>
                                <!-- Add more options as needed -->
                            </select>
                        </div>

                        <!-- Price Range -->
                        <div class="row mb-3">
                            <div class="col">
                                <label for="minPrice" class="form-label">Min Price</label>
                                <input type="number" name="minPrice" class="form-control" id="minPrice">
                            </div>
                            <div class="col">
                                <label for="maxPrice" class="form-label">Max Price</label>
                                <input type="number" name="maxPrice" class="form-control" id="maxPrice">
                            </div>
                        </div>

                        <!-- Sort By -->
                        <div class="mb-3">
                            <label for="sort" class="form-label">Sort By</label>
                            <select name="sort" id="sort" class="form-select">
                                <option value="createdAt">Created At</option>
                                <option value="price,asc">Price: Low to High</option>
                                <option value="price,desc">Price: High to Low</option>
                            </select>
                        </div>
                    </div>

                    <!-- Modal Footer with Submit Button -->
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Search</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="row col-12">
        <div th:each="property : ${properties}" class="col-lg-4 col-md-6 col-sm-12 property">
            <div class="card">
                <div class="image-container">
                    <img alt="pictures of all properties"
                         th:src="'data:image/jpeg;base64,' + ${property.imageUrl}"
                         onerror="this.onerror=null;this.src='/images/pexels-alexander-kovalev-2871478.webp';" loading="lazy" width="1024" height="683">
                </div>

                <div class="card-body">
                    <a th:href="@{/properties/show/{id}(id=${property.id})}" class="card-body-link">
                        <h6 style="font-weight: 400; text-transform: uppercase;">
                            <div th:text="#{${property.propertyTransferType.name}}"></div>
                        </h6>
                        <h5>
                            <span th:text="#{${property.propertyType.key}}"></span>, <span th:text="${property.price} + ' EUR'"></span>
                        </h5>
                        <h6><span th:text="#{village}"></span>
                            <span th:if="${#locale.language == 'bg'}" th:text="${property.villageDTO.name} + ', '"></span>
                            <span th:if="${#locale.language == 'en'}" th:text="${property.villageDTO.latinName} + ', '"></span>
                            <span th:if="${#locale.language == 'de'}" th:text="${property.villageDTO.latinName} + ', '"></span>
                            <span th:text="#{region}"></span>
                            <span th:text="#{${property.villageDTO.region}}"></span>
                        </h6>
                    </a>
                    <br>
                    <a th:href="@{/properties/show/{id}(id=${property.id})}" class="btn btn-info" style="font-size: 15px;"><span th:text="#{property.see.more}"></span></a>
                </div>
            </div>
        </div>
    </div>


    <div class="card-actions" style="font-size: 15px;">
        <div class="text-center pagination">
            <div>
                <a th:href="@{/properties}" aria-label="to the first page">
                    <button id="first" class="btn">
                        <i class="fas fa-angle-double-left"></i>
                    </button>
                </a>
            </div>

            <div>
                <a th:href="@{/properties/{page}(page=${page >= 1 ? page - 1 : 0})}">
                    <button id="prev" class="btn">
                        <i class="fas fa-chevron-left"></i><span th:text="#{previous.page}" class="pagination-btn-text"></span>
                    </button>
                </a>
            </div>

            <div>
                <input type="number" id="currentPage" th:value="${page != null ? page + 1 : 1}"
                       onkeyup="updatePageValue(event)" style="width: 50px;" aria-labelledby="number">

                <span th:text="#{from.page}"></span>
                <span th:text="${pagesCount}"></span>
            </div>

            <div>
                <a th:href="@{/properties/{page}(page=${page != null ? (page < pagesCount - 1 ? page + 1 : pagesCount - 1) : 1})}">
                    <button id="next" class="btn">
                        <span th:text="#{next.page}" class="pagination-btn-text"></span>  <i class="fas fa-chevron-right"></i>
                    </button>
                </a>
            </div>
            <div>
                <a th:href="@{/properties/{page}(page=${pagesCount - 1})}" aria-label="to the last page">
                    <button id="last" class="btn">
                        <i class="fas fa-angle-double-right"></i>
                    </button>
                </a>
            </div>
        </div>
    </div>


</div>

<div th:replace="authModals :: loginModal"></div>
<div th:replace="authModals :: verificationModal"></div>
<div th:replace="authModals :: registrationModal"></div>

<div th:replace="fragments :: footer"></div>

<script src="/js/min/loginModal.min.js"></script>
<script src="/js/min/showToast.min.js"></script>
<script src="/js/min/verificationModal.min.js"></script>
<script src="/js/min/registrationModal.min.js"></script>
<script th:inline="javascript">
    var registrationModal = [[${registrationModal}]];
</script>
<script src="/js/min/setActiveTab.min.js"></script>
<script src="/js/min/businessCardValidations-script.min.js"></script>
<script>
function updatePageValue(event) {
    if (event.key === 'Enter') {
        var currentPageInput = document.getElementById('currentPage');
        var pageCount = [[${pagesCount}]];
        var currentPageValue = parseInt(currentPageInput.value);

        if (currentPageValue >= 0 && currentPageValue <= pageCount) {
            var newPageValue = currentPageValue - 1;
            if (newPageValue >= 0) {
                var currentURL = window.location.href;
                var baseURL = currentURL.split('?')[0];
                var queryParams = currentURL.split('?')[1];

                var newBaseURL;
                if (baseURL.endsWith('/properties')) {
                    newBaseURL = baseURL + "/" + newPageValue;
                    console.log(newBaseURL)
                } else {
                    newBaseURL = baseURL.replace(/\/\d+$/, '/' + newPageValue);
                }

                var newURL = queryParams ? newBaseURL + '?' + queryParams : newBaseURL;
                window.location.href = newURL;
            }
        }
    }
}
</script>
<script src="/js/min/showSubscriptionToast.min.js"></script>
<script src="/js/min/properties-navScript.min.js"></script>
</body>
</html>
