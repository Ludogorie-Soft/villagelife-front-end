    <meta charset="UTF-8">

    <meta name="robots" content="all">
    <title th:text="#{property.title}"></title>
    <link th:href="@{/images/village-life-logo-icon.png}" rel="icon" type="image/png"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/0.8.2/css/flag-icon.min.css" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <!-- Include noUiSlider CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/min/list-properties.min.css">
    <link rel="stylesheet" href="/css/min/menu-style-about-us.min.css">
    <link rel="stylesheet" href="/css/min/auth.min.css">
    <link rel="stylesheet" href="/css/min/propertySearch.min.css">
</head>
<body>
<div th:replace="fragments :: property-menu"></div>
<div th:replace="fragments :: property-hamburger-menu"></div>
<div class="container" style="padding-top: 10px;">
    <!-- Success Toast -->
    <div id="successToast" class="toast align-items-center position-fixed start-50 translate-middle-x bg-success text-white"
         role="alert" aria-live="assertive" aria-atomic="true" th:if="${successMessage != null}">
        <div class="toast-header bg-success text-white">
            <strong class="me-auto" th:text="#{${successMessage}}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>

    <!-- Error Toast -->
    <div id="errorToast" class="toast align-items-center position-fixed start-50 translate-middle-x bg-danger text-white"
         role="alert" aria-live="assertive" aria-atomic="true" th:if="${errorMessage != null}">
        <div class="toast-header bg-danger text-white">
            <strong class="me-auto" th:text="#{${errorMessage}}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>

    <div class="search-bar-row d-flex flex-wrap align-items-center justify-content-between">
        <!-- Form for Region and Village Name Filters -->
        <form th:action="@{/filter/search-property/0}" method="get"
              class="d-flex flex-column flex-sm-row align-items-center flex-grow-1 me-3">
            <div class="col-12 col-sm-4 d-flex align-items-center justify-content-center mb-2 mb-sm-0"
                 style="padding: 0;">
                <div class="input-group">
                    <select name="regionName" class="form-select fixed-width" id="regionName">
                        <option value="" selected disabled style="text-align: left;"
                                th:text="#{choose.region}"></option>
                        <option th:each="region : ${regions}" th:value="${region.regionName}"
                                th:text="#{${region.regionName}}" aria-label="regionName"></option>
                    </select>
                </div>
            </div>
            <div class="col-12 col-sm-8 d-flex align-items-center justify-content-center mb-2 mb-sm-0"
                 style="padding: 0;">
                <div class="input-group">
                    <label class="input-group-text icon-label" for="search-input" style="height: 35px !important;">
                        <i class="fa-solid fa-magnifying-glass" style="font-size: 14px;"></i>
                    </label>
                    <input type="text" name="villageName" id="search-input" class="form-control form-control-sm"
                           th:placeholder="#{placeholder.search}">
                    <button class="btn custom-filter-button" type="submit" style="font-weight: bold;"
                            th:text="#{searching}"></button>
                    <button type="button" id="clearSearchButton" class="btn btn-warning" th:text="#{search.clear.button}"></button>
                    <!-- Confirmation Modal -->
                    <div class="modal fade" id="clearWarningModal" tabindex="-1" aria-labelledby="clearWarningModalLabel" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="clearWarningModalLabel" th:text="#{search.confirm.clear}"></h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <p th:text="#{search.clear.warning}"></p>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" id="cancelClearSearch" data-bs-dismiss="modal" th:text="#{search.cancel.clear}"></button>
                                    <button type="button" class="btn btn-danger" id="confirmClearSearch" th:text="#{search.clear}"></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <button type="button" class="btn custom-filter-button" data-bs-toggle="modal" data-bs-target="#advancedSearchModal">
            <i class="fas fa-filter filter-icon"></i><span th:text="#{filter.search}"></span>
        </button>
        <div th:if="${session.admin}">
            <button type="button" class="btn custom-filter-button" data-bs-toggle="modal" data-bs-target="#userSearchDataModal">
                <i class="fa-regular fa-floppy-disk" style="color: white;"></i><span th:text="#{save.search}"></span>
            </button>
        </div>
    </div>

    <div class="modal fade" id="userSearchDataModal" tabindex="-1" aria-labelledby="userSearchDataModalLabel"
         aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="padding-left: 40px;padding-right: 40px;">
                <form th:action="@{/user-search-data}" method="post">
                    <div id="villageError" class="text-danger" style="display: none; margin-top: 10px;">
                        <p th:text="#{search.select.region}"></p>
                    </div>
                    <div class="mb-3">
                        <label for="searchName" class="form-label" th:text="#{save.search.name}"></label>
                        <input type="text" class="form-control" th:field="*{userSearchDataDTO.searchName}" id="searchName" required/>
                    </div>

                    <!-- Hidden fields to store search criteria -->
                    <input type="hidden" name="regionName" id="saveRegionName"/>
                    <input type="hidden" name="villageName" id="saveVillageName"/>
                    <input type="hidden" name="propertyTypes" id="savePropertyTypes"/>
                    <input type="hidden" name="propertyTransferType" id="savePropertyTransferType"/>
                    <input type="hidden" name="minBuiltUpArea" id="saveMinBuiltUpArea"/>
                    <input type="hidden" name="maxBuiltUpArea" id="saveMaxBuiltUpArea"/>
                    <input type="hidden" name="minYardArea" id="saveMinYardArea"/>
                    <input type="hidden" name="maxYardArea" id="saveMaxYardArea"/>
                    <input type="hidden" name="minRoomsCount" id="saveMinRoomsCount"/>
                    <input type="hidden" name="maxRoomsCount" id="saveMaxRoomsCount"/>
                    <input type="hidden" name="minBathroomsCount" id="saveMinBathroomsCount"/>
                    <input type="hidden" name="maxBathroomsCount" id="saveMaxBathroomsCount"/>
                    <input type="hidden" name="heating" id="saveHeating"/>
                    <input type="hidden" name="constructionTypes" id="saveConstructionTypes"/>
                    <input type="hidden" name="propertyConditions" id="savePropertyConditions"/>
                    <input type="hidden" name="minConstructionYear" id="saveMinConstructionYear"/>
                    <input type="hidden" name="maxConstructionYear" id="saveMaxConstructionYear"/>
                    <input type="hidden" name="minPrice" id="saveMinPrice"/>
                    <input type="hidden" name="maxPrice" id="saveMaxPrice"/>
                    <input type="hidden" name="minRentPrice" id="saveMinRentPrice"/>
                    <input type="hidden" name="maxRentPrice" id="saveMaxRentPrice"/>
                    <input type="hidden" name="ownershipTypes" id="saveOwnershipTypes"/>

                    <div class="modal-footer">
                        <button type="submit" class="btn btn-search" th:text="#{save.search}"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="advancedSearchModal" tabindex="-1" aria-labelledby="advancedSearchModalLabel"
         aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="padding-left: 40px;padding-right: 40px;">
                <form th:action="@{/filter/search-property/0}" method="get">
                    <div class="modal-header">
                        <h5 class="modal-title" id="advancedSearchModalLabel" th:text="#{advanced.property.search}"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" th:text="#{advanced.property.search.types}"></label>
                            <div>
                                <div class="form-check">
                                    <input type="checkbox" name="propertyTypes" value="HOUSE" id="propertyTypeHouse"
                                           class="form-check-input">
                                    <label for="propertyTypeHouse" class="form-check-label" th:text="#{property.type.house}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="propertyTypes" value="APARTMENT"
                                           id="propertyTypeApartment" class="form-check-input">
                                    <label for="propertyTypeApartment" class="form-check-label" th:text="#{property.type.apartment}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="propertyTypes" value="VILLA" id="propertyTypeVilla"
                                           class="form-check-input">
                                    <label for="propertyTypeVilla" class="form-check-label" th:text="#{property.type.villa}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="propertyTypes" value="FLOOR_OF_A_HOUSE"
                                           id="propertyTypeFloorOfHouse" class="form-check-input">
                                    <label for="propertyTypeFloorOfHouse" class="form-check-label" th:text="#{property.type.floor.of.a.house}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="propertyTypes" value="BUSINESS_PROPERTY"
                                           id="propertyTypeBusinessProperty" class="form-check-input">
                                    <label for="propertyTypeBusinessProperty" class="form-check-label" th:text="#{property.type.business.property}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="propertyTypes" value="PLOT" id="propertyTypePlot"
                                           class="form-check-input">
                                    <label for="propertyTypePlot" class="form-check-label" th:text="#{property.type.plot}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="propertyTypes" value="AGRICULTURAL_LAND"
                                           id="propertyTypeAgriculturalLand" class="form-check-input">
                                    <label for="propertyTypeAgriculturalLand" class="form-check-label" th:text="#{property.type.agricultural.land}"></label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label id="propertyTransferTypeLabel" class="form-label" th:text="#{advanced.property.search.transfer}"></label>
                            <div>
                                <input type="radio" name="propertyTransferType" value="RENT" id="rentOption"
                                       aria-labelledby="propertyTransferTypeLabel" class="form-check-input">
                                <label for="rentOption" th:text="#{property.transfer.type.rent}"></label>
                            </div>
                            <div>
                                <input type="radio" name="propertyTransferType" value="SALE" id="saleOption"
                                       aria-labelledby="propertyTransferTypeLabel" class="form-check-input">
                                <label for="saleOption" th:text="#{property.transfer.type.sale}"></label>
                            </div>
                        </div>

                        <!-- Built-up Area Range Slider -->
                        <div class="mb-3" style="padding-bottom: 10px;">
                            <label class="form-label" style="padding-bottom: 35px;" th:text="#{advanced.property.search.built.up.area}"></label>
                            <div id="builtUpAreaSlider"></div>
                            <div id="builtUpAreaRuler" class="slider-ruler"></div>
                            <input type="hidden" name="minBuiltUpArea" id="minBuiltUpArea"/>
                            <input type="hidden" name="maxBuiltUpArea" id="maxBuiltUpArea"/>
                        </div>

                        <!-- Yard Area Range Slider -->
                        <div class="mb-3" style="padding-bottom: 10px;">
                            <label class="form-label" style="padding-bottom: 35px;" th:text="#{advanced.property.search.yard.area}"></label>
                            <div id="yardAreaSlider"></div>
                            <div id="yardAreaRuler" class="slider-ruler"></div>
                            <input type="hidden" name="minYardArea" id="minYardArea"/>
                            <input type="hidden" name="maxYardArea" id="maxYardArea"/>
                        </div>

                        <!-- Rooms Range Slider -->
                        <div class="mb-3" style="padding-bottom: 10px;">
                            <label class="form-label" style="padding-bottom: 35px;" th:text="#{property.rooms.count}"></label>
                            <div id="roomsSlider"></div>
                            <div id="roomsRuler" class="slider-ruler"></div>
                            <input type="hidden" name="minRoomsCount" id="minRoomsCount"/>
                            <input type="hidden" name="maxRoomsCount" id="maxRoomsCount"/>
                        </div>

                        <!-- Bathrooms Range Slider -->
                        <div class="mb-3" style="padding-bottom: 10px;">
                            <label class="form-label" style="padding-bottom: 35px;" th:text="#{property.bathrooms.count}"></label>
                            <div id="bathroomsSlider"></div>
                            <div id="bathroomsRuler" class="slider-ruler"></div>
                            <input type="hidden" name="minBathroomsCount" id="minBathroomsCount"/>
                            <input type="hidden" name="maxBathroomsCount" id="maxBathroomsCount"/>
                        </div>

                        <!-- Heating and Construction Types -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <span th:text="#{property.heating}"></span>
                            </label>
                            <div>
                                <div th:each="heatingType : ${T(com.ludogorieSoft.villagelifefrontend.enums.HeatingType).values()}"
                                     class="form-check">
                                    <input type="checkbox"
                                           th:id="${'heatingType-' + heatingType}"
                                           th:name="heating"
                                           th:value="${heatingType.key}"
                                           class="form-check-input" />
                                    <label th:for="${'heatingType-' + heatingType}"
                                           class="form-check-label"
                                           th:text="#{${heatingType.key}}"></label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" th:text="#{property.construction.type}"></label>
                            <div>
                                <div class="form-check">
                                    <input type="checkbox" name="constructionTypes" value="BRICKS"
                                           id="constructionTypeBricks" class="form-check-input">
                                    <label for="constructionTypeBricks" class="form-check-label" th:text="#{construction.type.bricks}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="constructionTypes" value="PANEL"
                                           id="constructionTypePanel" class="form-check-input">
                                    <label for="constructionTypePanel" class="form-check-label" th:text="#{construction.type.panel}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="constructionTypes" value="WOOD"
                                           id="constructionTypeWood" class="form-check-input">
                                    <label for="constructionTypeWood" class="form-check-label" th:text="#{construction.type.wood}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="constructionTypes" value="TIMBER_FRAMED"
                                           id="constructionTypeTimberFramed" class="form-check-input">
                                    <label for="constructionTypeTimberFramed" class="form-check-label" th:text="#{construction.type.timber.framed}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="constructionTypes" value="ADOBE"
                                           id="constructionTypeAdobe" class="form-check-input">
                                    <label for="constructionTypeAdobe" class="form-check-label" th:text="#{construction.type.adobe}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="constructionTypes" value="REINFORCED_CONCRETE"
                                           id="constructionTypeReinforcedConcrete" class="form-check-input">
                                    <label for="constructionTypeReinforcedConcrete" class="form-check-label" th:text="#{construction.type.reinforced.concrete}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="constructionTypes" value="STONE"
                                           id="constructionTypeStone" class="form-check-input">
                                    <label for="constructionTypeStone" class="form-check-label" th:text="#{construction.type.stone}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="constructionTypes" value="CLAY"
                                           id="constructionTypeClay" class="form-check-input">
                                    <label for="constructionTypeClay" class="form-check-label" th:text="#{construction.type.clay}"></label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" th:text="#{property.condition}"></label>
                            <div>
                                <div class="form-check">
                                    <input type="checkbox" name="propertyConditions" value="NEW"
                                           id="propertyConditionNew" class="form-check-input">
                                    <label for="propertyConditionNew" class="form-check-label" th:text="#{property.condition.new}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="propertyConditions" value="AFTER_COMPLETE_RENOVATION"
                                           id="propertyConditionAfterCompleteRenovation" class="form-check-input">
                                    <label for="propertyConditionAfterCompleteRenovation" class="form-check-label" th:text="#{after.complete.renovation}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="propertyConditions" value="GOOD"
                                           id="propertyConditionGood" class="form-check-input">
                                    <label for="propertyConditionGood" class="form-check-label" th:text="#{property.condition.good}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="propertyConditions" value="NEEDS_REPAIR"
                                           id="propertyConditionNeedsRepair" class="form-check-input">
                                    <label for="propertyConditionNeedsRepair" class="form-check-label" th:text="#{needs.repair}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="propertyConditions" value="NEEDS_COMPLETE_RENOVATION"
                                           id="propertyConditionNeedsCompleteRenovation" class="form-check-input">
                                    <label for="propertyConditionNeedsCompleteRenovation" class="form-check-label" th:text="#{needs.complete.renovation}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="propertyConditions" value="FOR_DEMOLITION"
                                           id="propertyConditionForDemolition" class="form-check-input">
                                    <label for="propertyConditionForDemolition" class="form-check-label" th:text="#{for.demolition}"></label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" th:text="#{ownership.type.label}"></label>
                            <div>
                                <div class="form-check">
                                    <input type="checkbox" name="ownershipTypes" value="INDIVIDUAL"
                                           id="ownershipTypeIndividual" class="form-check-input">
                                    <label for="ownershipTypeIndividual" class="form-check-label" th:text="#{auth.individual}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="ownershipTypes" value="AGENCY"
                                           id="ownershipTypeAgency" class="form-check-input">
                                    <label for="ownershipTypeAgency" class="form-check-label" th:text="#{auth.agency}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="ownershipTypes" value="BUILDER"
                                           id="ownershipTypeBuilder" class="form-check-input">
                                    <label for="ownershipTypeBuilder" class="form-check-label" th:text="#{auth.builder}"></label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" name="ownershipTypes" value="INVESTOR"
                                           id="ownershipTypeInvestor" class="form-check-input">
                                    <label for="ownershipTypeInvestor" class="form-check-label" th:text="#{auth.investor}"></label>
                                </div>
                            </div>
                        </div>

                        <!-- Price Range Slider -->
                        <div class="mb-3" style="padding-bottom: 10px;">
                            <label class="form-label" style="padding-bottom: 35px;" th:text="#{advanced.property.search.price}"></label>
                            <div id="priceSlider"></div>
                            <div id="priceRuler" class="slider-ruler"></div>
                            <input type="hidden" name="minPrice" id="minPrice"/>
                            <input type="hidden" name="maxPrice" id="maxPrice"/>
                        </div>

                        <div class="mb-3" style="padding-bottom: 10px;">
                            <label class="form-label" style="padding-bottom: 35px;" th:text="#{advanced.property.search.price}"></label>
                            <div id="priceRentSlider"></div>
                            <div id="priceRentRuler" class="slider-ruler"></div>
                            <input type="hidden" name="minPrice" id="minRentPrice"/>
                            <input type="hidden" name="maxPrice" id="maxRentPrice"/>
                        </div>

                        <div class="mb-3" style="padding-bottom: 10px;">
                            <label class="form-label" style="padding-bottom: 35px;" th:text="#{property.construction.year}"></label>
                            <div id="constructionYearSlider"></div>
                            <div id="constructionYearRuler" class="slider-ruler"></div>
                            <input type="hidden" name="minConstructionYear" id="minConstructionYear"/>
                            <input type="hidden" name="maxConstructionYear" id="maxConstructionYear"/>
                        </div>

                        <!-- Sort By -->
                        <div class="mb-2">
                            <label for="sort" class="form-label" th:text="#{advanced.property.search.sort}"></label>
                            <select name="sort" id="sort" class="form-select">
                                <option value="createdAt" th:text="#{advanced.property.search.sort.created.at}"></option>
                                <option value="price,asc" th:text="#{advanced.property.search.sort.price.from.low}"></option>
                                <option value="price,desc" th:text="#{advanced.property.search.sort.price.from.high}"></option>
                            </select>
                        </div>
                    </div>

                    <!-- Modal Footer with Submit Button -->
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-search" th:text="#{searching}"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="row col-12">
        <div th:each="property : ${properties}" class="col-lg-4 col-md-6 col-sm-12 property">
            <div class="card">
                <div class="image-container">
                    <img alt="pictures of all properties"

<script>
    function updatePageValue(event) {
        if (event.key === 'Enter') {
            var currentPageInput = document.getElementById('currentPage');
            var pageCount = [[${pagesCount}]];
            var currentPageValue = parseInt(currentPageInput.value);

            if (currentPageValue >= 0 && currentPageValue <= pageCount) {
                var newPageValue = currentPageValue - 1;
                if (newPageValue >= 0) {
                    var currentURL = window.location.href;
                    var baseURL = currentURL.split('?')[0];
                    var queryParams = currentURL.split('?')[1];

                    var newBaseURL;
                    if (baseURL.endsWith('/properties')) {
                        newBaseURL = baseURL + "/" + newPageValue;
                        console.log(newBaseURL)
                    } else {
                        newBaseURL = baseURL.replace(/\/\d+$/, '/' + newPageValue);
                    }

                    var newURL = queryParams ? newBaseURL + '?' + queryParams : newBaseURL;
                    window.location.href = newURL;
                }
            }
        }
    }
</script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
    document.querySelector('#advancedSearchModal form').addEventListener('submit', function(event) {
        event.preventDefault();

        let form = event.target;
        let formData = new FormData(form);
        let searchParams = new URLSearchParams();

        formData.forEach((value, key) => {
            if (value.trim() !== "") { // Only add the parameter if its value is not an empty string
                searchParams.append(key, value);
            }
        });

        let sortValue = form.querySelector('[name="sort"]').value;
        if (sortValue) {
            searchParams.set('sort', sortValue);
        }

        let actionURL = form.action;
        let newURL = actionURL + '?' + searchParams.toString();

        window.location.href = newURL;
    });
});
</script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
    function createSlider(sliderId, minInputId, maxInputId, rulerId, min, max, step, startMin, startMax, maxLabel, numRulerMarks) {
        const slider = document.getElementById(sliderId);
        const ruler = document.getElementById(rulerId);

        const minValueBox = document.createElement('div');
        const maxValueBox = document.createElement('div');
        minValueBox.className = 'slider-value-box min-value';
        maxValueBox.className = 'slider-value-box max-value';
        slider.appendChild(minValueBox);
        slider.appendChild(maxValueBox);

        noUiSlider.create(slider, {
            start: [startMin, startMax],
            connect: true,
            range: {
                'min': min,
                'max': max
            },
            step: step,
            format: {
                to: function (value) {
                    return Math.round(value);
                },
                from: function (value) {
                    return value;
                }
            }
        });

        function adjustValueBoxWidth(valueBox) {
            const text = valueBox.innerHTML;
            const padding = 5;
            const minWidth = 5;

            const boxWidth = Math.max(text.length * 8 + padding * 2, minWidth);
            valueBox.style.width = `${boxWidth}px`;
        }

        slider.noUiSlider.on('update', function (values) {
            const minValue = Math.round(values[0]);
            const maxValue = Math.round(values[1]);

            const minInput = document.getElementById(minInputId);
            const maxInput = document.getElementById(maxInputId);

            if (minValue !== startMin) {
                minInput.value = minValue;
                minInput.removeAttribute('disabled');
            } else {
                minInput.value = ''; // Clear the value
                minInput.setAttribute('disabled', 'true');
            }

            if (maxValue !== startMax) {
                maxInput.value = maxValue;
                maxInput.removeAttribute('disabled');
            } else {
                maxInput.value = ''; // Clear the value
                maxInput.setAttribute('disabled', 'true');
            }

            minValueBox.innerHTML = minValue;

            if (maxValue === startMax) {
                maxValueBox.innerHTML = `${startMax - 1}+`;
            } else {
                maxValueBox.innerHTML = maxValue;
            }

            if (minValue === startMax) {
                minValueBox.innerHTML = `${startMax - 1}+`;
            } else {
                minValueBox.innerHTML = minValue;
            }

            adjustValueBoxWidth(minValueBox);
            adjustValueBoxWidth(maxValueBox);

            const minPosition = (minValue - min) / (max - min) * 100;
            const maxPosition = (maxValue - min) / (max - min) * 100;
            minValueBox.style.left = `calc(${minPosition}% - 20px)`;
            maxValueBox.style.left = `calc(${maxPosition}% - 20px)`;
        });

        let rulerHtml = '';
        const rulerStep = Math.ceil((max - min) / (numRulerMarks - 1) / step) * step;
        for (let value = min; value <= max; value += rulerStep) {
            const position = ((value - min) / (max - min)) * 100;
            rulerHtml += `<span class="ruler-mark" style="left: ${position}%">${value}</span>`;
        }
        ruler.innerHTML = rulerHtml;
    }

    createSlider("builtUpAreaSlider", "minBuiltUpArea", "maxBuiltUpArea", "builtUpAreaRuler", 0, 1001, 10, 0, 1001, true, 10);
    createSlider("yardAreaSlider", "minYardArea", "maxYardArea", "yardAreaRuler", 0, 5001, 10, 0, 5001, true, 10);
    createSlider("roomsSlider", "minRoomsCount", "maxRoomsCount", "roomsRuler", 0, 21, 1, 0, 21, true, 7);
    createSlider("bathroomsSlider", "minBathroomsCount", "maxBathroomsCount", "bathroomsRuler", 0, 21, 1, 0, 21, true, 7);
    createSlider("priceSlider", "minPrice", "maxPrice", "priceRuler", 0, 500001, 100, 0, 500001, true, 10);
    createSlider("priceRentSlider", "minRentPrice", "maxRentPrice", "priceRentRuler", 0, 5001, 50, 0, 5001, true, 10);
    const nextYear = new Date().getFullYear() + 1;
    createSlider("constructionYearSlider", "minConstructionYear", "maxConstructionYear", "constructionYearRuler", 1900, nextYear, 1, 1900, nextYear, true, 10);
});
</script>

<!--update params from url-->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const searchBarForm = document.querySelector(".search-bar-row form");
        const modalForm = document.querySelector("#advancedSearchModal form");

        /**
         * Populate form fields from query parameters
         */
        function populateFieldsFromQuery(queryString, form) {
            const params = new URLSearchParams(queryString);
            params.forEach((value, key) => {
                const fields = form.querySelectorAll(`[name="${key}"]`);
                fields.forEach(field => {
                    if (field.type === "checkbox" || field.type === "radio") {
                        field.checked = Array.isArray(value)
                            ? value.includes(field.value)
                            : field.value === value;
                    } else if (field.tagName === "SELECT") {
                        field.value = value;
                    } else {
                        field.value = value;
                    }
                });

                if (fields.length > 1 && fields[0].type === "checkbox") {
                    const values = params.getAll(key);
                    fields.forEach(field => {
                        field.checked = values.includes(field.value);
                    });
                }

                if (key.startsWith("min") || key.startsWith("max")) {
                    const sliderField = form.querySelector(`#${key}`);
                    if (sliderField) {
                        sliderField.value = value;
                        const associatedRuler = document.querySelector(`#${key}Ruler`);
                        if (associatedRuler) {
                            associatedRuler.innerHTML = value;
                        }

                        const slider = document.querySelector(`#${key}Slider`);
                        if (slider && slider.noUiSlider) {
                            const sliderValues = [
                                params.get("min" + key.slice(3)),
                                params.get("max" + key.slice(3)),
                            ];
                            slider.noUiSlider.set(sliderValues);
                        }
                    }
                }
            });
        }

        /**
         * Merge data from both forms
         */
        function mergeFormData(form1, form2) {
            const formData = new FormData(form1);
            for (let [key, value] of new FormData(form2)) {
                if (!formData.has(key)) {
                    formData.append(key, value);
                } else {
                    formData.delete(key);
                    const form1Values = new FormData(form1).getAll(key);
                    const form2Values = new FormData(form2).getAll(key);
                    const combinedValues = [...new Set([...form1Values, ...form2Values])];
                    combinedValues.forEach(v => formData.append(key, v));
                }
            }
            return new URLSearchParams(formData);
        }

        const queryString = window.location.search;
        if (queryString) {
            populateFieldsFromQuery(queryString, searchBarForm);
            populateFieldsFromQuery(queryString, modalForm);
        }

        searchBarForm.addEventListener("submit", function (e) {
            e.preventDefault();
            const queryParams = mergeFormData(searchBarForm, modalForm);
            const actionUrl = searchBarForm.getAttribute("action");
            window.location.href = `${actionUrl}?${queryParams.toString()}`;
        });

        modalForm.addEventListener("submit", function (e) {
            e.preventDefault();
            const queryParams = mergeFormData(searchBarForm, modalForm);
            const actionUrl = modalForm.getAttribute("action");
            window.location.href = `${actionUrl}?${queryParams.toString()}`;
        });
    });
</script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const queryString = window.location.search;
        const params = new URLSearchParams(queryString);

        function updateSliderFromParams(sliderId, minInputId, maxInputId, paramMinKey, paramMaxKey, defaultMin, defaultMax) {
            const slider = document.getElementById(sliderId);

            if (!slider || !slider.noUiSlider) return;

            const paramMin = parseInt(params.get(paramMinKey)) || defaultMin;
            const paramMax = parseInt(params.get(paramMaxKey)) || defaultMax;

            slider.noUiSlider.set([paramMin, paramMax]);

            const minInput = document.getElementById(minInputId);
            const maxInput = document.getElementById(maxInputId);
            if (minInput) minInput.value = paramMin !== defaultMin ? paramMin : '';
            if (maxInput) maxInput.value = paramMax !== defaultMax ? paramMax : '';
        }

        updateSliderFromParams("builtUpAreaSlider", "minBuiltUpArea", "maxBuiltUpArea", "minBuiltUpArea", "maxBuiltUpArea", 0, 1001);

<script>
    document.addEventListener("DOMContentLoaded", function () {
    const rentOption = document.getElementById("rentOption");
    const saleOption = document.getElementById("saleOption");

    function clearPriceParams() {
        // Clear inputs for price sliders
        const minPriceInput = document.getElementById("minPrice");
        const maxPriceInput = document.getElementById("maxPrice");
        const minRentPriceInput = document.getElementById("minRentPrice");
        const maxRentPriceInput = document.getElementById("maxRentPrice");

        if (minPriceInput) minPriceInput.value = "";
        if (maxPriceInput) maxPriceInput.value = "";
        if (minRentPriceInput) minRentPriceInput.value = "";
        if (maxRentPriceInput) maxRentPriceInput.value = "";

        // Reset sliders to their min/max positions
        const priceSlider = document.getElementById("priceSlider");
        const priceRentSlider = document.getElementById("priceRentSlider");

        if (priceSlider?.noUiSlider) {
            priceSlider.noUiSlider.set([priceSlider.noUiSlider.options.range.min, priceSlider.noUiSlider.options.range.max]);
        }
        if (priceRentSlider?.noUiSlider) {
            priceRentSlider.noUiSlider.set([priceRentSlider.noUiSlider.options.range.min, priceRentSlider.noUiSlider.options.range.max]);
        }

        // Remove price parameters from the URL
        const url = new URL(window.location);
        url.searchParams.delete("minPrice");
        url.searchParams.delete("maxPrice");
        url.searchParams.delete("minRentPrice");
        url.searchParams.delete("maxRentPrice");
        window.history.replaceState({}, '', url); // Update the URL without reloading the page
    }

    rentOption.addEventListener("change", clearPriceParams);
    saleOption.addEventListener("change", clearPriceParams);
});

</script>
