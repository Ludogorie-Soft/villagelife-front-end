<body>
<div th:replace="fragments :: hamburger-menu"></div>
<div id="modalContainer"></div>
<h1>Reset Your Password</h1>
<form th:action="@{/auth/submit-new-password}" th:object="${resetPasswordRequest}" method="post">
    <!-- Hidden fields for token and userId -->
    <input type="hidden" th:field="*{token}">
    <input type="hidden" th:field="*{userId}">

    <!-- Password input -->
    <label for="password">New Password:</label>
    <input type="password" id="password" th:field="*{password}" minlength="8" maxlength="255" required>
    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    <br><br>

    <!-- Repeated Password input -->
    <label for="repeatedPassword">Confirm Password:</label>
    <input type="password" id="repeatedPassword" th:field="*{repeatedPassword}" minlength="8" maxlength="255" required>
    <div th:if="${#fields.hasErrors('repeatedPassword')}" th:errors="*{repeatedPassword}"></div>
    <br><br>

    <!-- Submit button -->
    <button type="submit">Reset Password</button>
</form>

<!-- Error Messages -->
<div th:if="${errorMessage}" style="color: red;">
    <p th:text="${errorMessage}"></p>
</div>

<div th:if="${errorMessage}" class="message alert alert-danger text-center">
    <p th:text="#{${errorMessage}}"></p>
</div>


<div th:replace="authModals :: loginModal"></div>
<div th:replace="authModals :: verificationModal"></div>
<div th:replace="authModals :: registrationModal"></div>
<body th:attr="data-send-email-reset-pass-modal=${sendEmailResetPassModal}">
<div th:replace="authModals :: resetPasswordModal"></div>
</body>
<body th:attr="data-email-sent-modal=${emailSentModal}">

</body>

<script>
    function updatePageValue(event) {
        if (event.key === 'Enter') {
            var currentPageInput = document.getElementById('currentPage');
            var pageCount = [[${pagesCount}]];
            var currentPageValue = parseInt(currentPageInput.value);

            if (currentPageValue >= 0 && currentPageValue <= pageCount) {
                var newPageValue = currentPageValue - 1;
                if (newPageValue >= 0) {
                    var currentURL = window.location.href;
                    var baseURL = currentURL.split('?')[0];
                    var queryParams = currentURL.split('?')[1];

                    var newBaseURL;
                    if (baseURL.endsWith('/')) {
                        newBaseURL = baseURL.slice(0, baseURL.lastIndexOf('/') + 1) + newPageValue;
                    } else {
                        newBaseURL = baseURL.replace(/\/\d+$/, '/' + newPageValue);
                    }

                    var newURL = queryParams ? newBaseURL + '?' + queryParams : newBaseURL;
                    window.location.href = newURL;
                }
            }
        }
    }
</script>
